<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Từ Rơi</title>
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Noto+Serif+SC:wght@600;700&family=Noto+Serif+JP:wght@600;700&family=Noto+Serif+KR:wght@600;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: playful study game, calm bamboo forest, quick and tactile
   IDEA: paper word-tags (Chinese, English, Japanese, Korean) drifting down through a bamboo grove, stamped with a red seal
   PICTURE: the play field itself: layered bamboo, mist, a falling tag, a grassy ground
   COLOUR and TYPE: bamboo green ground, pale mist, vermilion seal accent; Noto Serif SC for hanzi, Be Vietnam Pro for UI
   LAYOUT: green header bar with HUD, stage + 2x2 answers left, word log right (stacks under 960px) */
:root{color-scheme:light dark;
--bg:light-dark(#e4eedf,#0c1812);--ink:light-dark(#13231a,#e3eee6);--muted:light-dark(#4b6052,#9cb3a3);
--panel:light-dark(#ffffff,#13251b);--line:light-dark(#c6d8c0,#26442f);
--sky1:light-dark(#f4f9ef,#14301f);--sky2:light-dark(#cfe4c6,#0a160f);
--b1:light-dark(#4f8f58,#2d5d38);--b2:light-dark(#3a7745,#234a2c);--b3:light-dark(#9cc79a,#1b3a24);
--bar:light-dark(#2f6b3a,#16301e);--moon:light-dark(#ffffff,#e8e2bf);
--ground:light-dark(#6d5737,#33291b);--grass:light-dark(#5e9b5c,#2f6a3b);
--paper:#fffcf2;--seal:#d23a2b;--sealdk:#a8291d;--good:#2b8a4c}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif;overflow-x:clip;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow-y:auto}
main.layout{flex:1 1 auto;min-height:0;width:100%}
main.layout>section{display:flex;flex-direction:column;min-height:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--seal);outline-offset:2px}
.top{background:var(--bar);color:#fff;padding:12px max(4vw,12px)}
.top-in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.stamp{width:40px;height:40px;display:grid;place-items:center;background:var(--seal);border-radius:6px;font:700 24px/1 "Noto Serif SC",serif;box-shadow:inset 0 0 0 2px #fff4}
.brand h1{margin:0;font-size:26px;line-height:1.05;font-weight:700}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat small{font-size:13px;opacity:.8}.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.lives{display:flex;gap:6px}
.lan{width:16px;height:22px;border-radius:7px 7px 8px 8px;background:var(--seal);box-shadow:inset 0 -5px 0 #0003,0 0 10px #ff6a4d88;position:relative}
.lan::before{content:"";position:absolute;left:4px;right:4px;top:-3px;height:3px;background:#f2c14e;border-radius:2px}
.lan.off{background:#ffffff33;box-shadow:none}.lan.off::before{background:#ffffff44}
.pbtn{min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid #ffffff66;background:#ffffff14;color:#fff;font-weight:600}
.pbtn:hover{background:#ffffff26}
.layout{max-width:1240px;margin:0 auto;padding:clamp(10px,2vw,24px) max(3vw,10px);display:grid;gap:20px;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
@media(min-width:960px){.layout{grid-template-columns:minmax(0,1fr) 300px}}
@media(max-width:959px){.log{display:none!important}}
.stage{position:relative;flex:1 1 auto;min-height:220px;max-height:640px;border-radius:18px;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2));box-shadow:0 18px 40px -24px #0b2a1599,inset 0 0 0 1px var(--line);user-select:none}
.bg{position:absolute;inset:0;width:100%;height:100%}
.ground{position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(var(--grass) 0 7px,var(--ground) 7px);box-shadow:0 -6px 14px -6px #0004}
.tile{position:absolute;left:0;top:0;z-index:2;min-width:96px;padding:12px 18px 12px;text-align:center;color:#1b1510;background:var(--paper);border-radius:6px;box-shadow:0 12px 20px -10px #0008,inset 0 0 0 2px var(--seal),inset 0 0 0 5px var(--paper),inset 0 0 0 6px #d23a2b55;will-change:transform;visibility:hidden}
.tile::before{content:"";position:absolute;left:50%;top:-26px;width:1.5px;height:26px;background:#5b4a35}
.tile::after{content:"";position:absolute;left:calc(50% - 4px);top:6px;width:8px;height:8px;border-radius:50%;background:var(--sky2);box-shadow:inset 0 1px 2px #0005}
.hz{font:700 44px/1.15 "Noto Serif SC",serif;margin-top:8px;white-space:nowrap}
.py{font-weight:600;font-size:15px;color:var(--sealdk);height:0;opacity:0;overflow:hidden;transition:opacity .2s,height .2s;white-space:nowrap}
.show-py .py{height:22px;opacity:1}
.tile.hit{animation:pop .5s ease-out}.tile.miss{animation:shake .4s}.tile.dropped{filter:grayscale(.85) brightness(.92)}
@keyframes pop{40%{scale:1.2;box-shadow:0 0 0 10px #2b8a4c44,inset 0 0 0 2px var(--good)}100%{scale:1}}
@keyframes shake{25%{translate:-7px 0}75%{translate:7px 0}}
.flash{position:absolute;z-index:3;font-weight:700;font-size:20px;color:var(--good);pointer-events:none;animation:up .8s forwards;text-shadow:0 1px 0 #fff8}
@keyframes up{to{translate:0 -40px;opacity:0}}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 14px;text-align:left;border-radius:12px;border:2px solid var(--line);background:var(--panel);font-size:17px;font-weight:600;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--b1)}
.opt:disabled{cursor:default;opacity:.55}
.opt kbd{flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:6px;background:var(--bg);font:600 13px/1 "Be Vietnam Pro";color:var(--muted)}
.opt.good{background:var(--good);border-color:var(--good);color:#fff;opacity:1}
.opt.bad{background:var(--seal);border-color:var(--seal);color:#fff;opacity:1}
.opt.good kbd,.opt.bad kbd{background:#ffffff33;color:#fff}
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:12px;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(3px)}
.overlay[hidden]{display:none}
.card{width:min(440px,100%);max-height:100%;overflow:auto;background:var(--panel);border-radius:16px;padding:22px;box-shadow:0 20px 40px -20px #0007;border:1px solid var(--line)}
.card.wide{width:min(840px,100%)}
@media(min-width:700px){.cg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px;align-items:start}.cg>div:last-child>.lbl:first-child{margin-top:0}}
.card h2{margin:0 0 6px;font-size:32px;line-height:1.05;text-wrap:balance}
.card p{margin:0 0 14px;color:var(--muted)}
.card p.keys{font-size:14px;margin-top:-6px}
.lbl{font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg button,.tg button{min-height:48px;border-radius:10px;border:2px solid var(--line);background:var(--bg);font-weight:600;line-height:1.2;padding:6px}
.seg.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.seg [lang]{font-size:18px}
.hz:lang(ja),.seg [lang=ja],.log b:lang(ja),.miss-list b:lang(ja){font-family:"Noto Serif JP",serif}
.hz:lang(ko),.seg [lang=ko],.log b:lang(ko),.miss-list b:lang(ko){font-family:"Noto Serif KR",serif}
.hz:lang(en),.log b:lang(en),.miss-list b:lang(en){font-family:"Noto Serif",Georgia,serif}
.hz.long{font-size:32px}
.seg button small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--bar);border-color:var(--bar);color:#fff}
.seg button[aria-pressed=true] small{color:#ffffffcc}
.tg{display:flex;flex-wrap:wrap;gap:8px}
.tg button{min-height:44px;padding:0 14px;display:flex;align-items:center;gap:8px}
.tg button::before{content:"";width:30px;height:18px;border-radius:9px;background:var(--line);box-shadow:inset 3px 0 0 1px var(--panel);transition:.15s}
.tg button[aria-pressed=true]::before{background:var(--good);box-shadow:inset -12px 0 0 1px var(--good),inset -13px 0 0 3px #fff}
.cta{width:100%;min-height:52px;margin-top:18px;border:0;border-radius:12px;background:var(--seal);color:#fff;font-size:18px;font-weight:700;box-shadow:0 6px 0 var(--sealdk)}
.cta:active{translate:0 3px;box-shadow:0 3px 0 var(--sealdk)}
.ghost{width:100%;min-height:46px;margin-top:10px;border-radius:12px;border:2px solid var(--line);background:transparent;font-weight:600}
.big{font-size:52px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.rec{display:inline-block;margin-left:8px;padding:2px 10px;border-radius:99px;background:var(--seal);color:#fff;font-size:13px;vertical-align:middle}
.miss-list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.miss-list li,.log li{display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:baseline;gap:10px;padding:6px 10px;border-radius:8px;background:var(--bg)}
.miss-list b,.log b{font:700 20px/1.2 "Noto Serif SC",serif}
.miss-list i,.log i{font-style:normal;color:var(--sealdk);font-size:14px}
:root:not([data-theme=light]) .miss-list i,:root:not([data-theme=light]) .log i{color:light-dark(var(--sealdk),#ff8a7a)}
.log{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;align-self:start;max-height:100%;display:flex;flex-direction:column;min-height:0}
.log h2{margin:0;font-size:20px}
.log p{margin:2px 0 12px;color:var(--muted);font-size:14px}
.log ul{list-style:none;margin:0;padding:0;display:grid;align-content:start;gap:6px;overflow:auto;min-height:0}
.log li{grid-template-columns:8px auto auto minmax(0,1fr)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);align-self:center}.dot.no{background:var(--seal)}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
.foot{display:none}
@media(max-width:600px){.brand h1{font-size:22px}.hud{gap:6px 14px;width:100%}.pbtn{margin-left:auto}.hz{font-size:38px}.opt{font-size:16px;min-height:54px;padding:8px 10px;gap:8px}.card h2{font-size:28px}.big{font-size:44px}}
@media(prefers-reduced-motion:reduce){.tile.hit,.tile.miss,.flash{animation:none}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><div class="stamp" id="stamp" aria-hidden="true">字</div><h1 data-t="title">Từ Rơi</h1></div>
  <div class="hud">
    <div class="stat"><small data-t="score">Điểm</small><b id="score">0</b></div>
    <div class="stat"><small>Combo</small><b id="combo">x1</b></div>
    <div class="stat"><small data-t="lives">Mạng</small><div class="lives" id="lives"></div></div>
    <button class="pbtn" id="pauseBtn" type="button">Tạm dừng</button>
  </div>
</div></header>

<main class="layout">
  <section aria-label="Khu vực chơi">
    <div class="stage" id="stage">
      <svg class="bg" viewBox="0 0 400 600" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <defs>
          <g id="stalk">
            <rect x="-7" y="-100" width="14" height="800" rx="5"/>
            <rect x="-9" y="90" width="18" height="5" rx="2" opacity=".55"/>
            <rect x="-9" y="210" width="18" height="5" rx="2" opacity=".55"/>
            <rect x="-9" y="330" width="18" height="5" rx="2" opacity=".55"/>
            <rect x="-9" y="450" width="18" height="5" rx="2" opacity=".55"/>
            <ellipse cx="22" cy="86" rx="24" ry="5" transform="rotate(-24 22 86)"/>
            <ellipse cx="-20" cy="206" rx="22" ry="5" transform="rotate(28 -20 206)"/>
            <ellipse cx="24" cy="326" rx="26" ry="5" transform="rotate(-18 24 326)"/>
          </g>
        </defs>
        <circle cx="300" cy="110" r="44" fill="var(--moon)" opacity=".7"/>
        <g fill="var(--b3)" opacity=".9">
          <use href="#stalk" x="40" transform="scale(.8) translate(0 140)"/>
          <use href="#stalk" x="190" transform="scale(.8) translate(0 140)"/>
          <use href="#stalk" x="330" transform="scale(.8) translate(0 140)"/>
          <use href="#stalk" x="470" transform="scale(.8) translate(0 140)"/>
        </g>
        <g fill="var(--b1)">
          <use href="#stalk" x="12"/><use href="#stalk" x="118" y="-40"/><use href="#stalk" x="388" y="-20"/>
        </g>
        <g fill="var(--b2)"><use href="#stalk" x="62" y="30"/><use href="#stalk" x="352" y="10"/></g>
      </svg>
      <div class="tile" id="tile"><div class="hz" id="hz" lang="zh"></div><div class="py" id="py"></div></div>
      <div class="ground"></div>
      <div class="overlay" id="overlay"></div>
    </div>
    <div class="answers" id="answers"></div>
  </section>

  <aside class="log" aria-live="polite">
    <h2 data-t="log">Sổ từ trận này</h2>
    <p id="logSum">Chưa có từ nào.</p>
    <ul id="log"></ul>
  </aside>
</main>
<p class="foot" data-t="foot">Từ vựng HSK 1 và HSK 2. Phát âm dùng giọng đọc tiếng Trung có sẵn trong trình duyệt (nếu máy có). Phím 1–4 để chọn đáp án, Space để tạm dừng.</p>

over:"Game over",newRec:"New record",stats:(r,t,l,b)=>`${r}/${t} correct · ${l} best: ${b}`,review:"Words to review",again:"Play again",revive:"Watch an ad to revive (+1 life)",change:"Change language or level",
sum:(r,t)=>`${r}/${t} correct`,empty:"No words yet. Press Start to play.",
foot:"Learn Chinese, English, Japanese and Korean vocabulary. Pronunciation uses your browser's built-in voices, if your device has one for that language. Keys 1–4 pick an answer, Space pauses."}};
const $=id=>document.getElementById(id);
const stage=$("stage"),tile=$("tile"),hzEl=$("hz"),pyEl=$("py"),ans=$("answers"),ov=$("overlay"),logEl=$("log");
const GROUND=46,MAXL=3;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let nl="";try{nl=navigator.language||""}catch(e){}
const P={ui:store.get("wd-ui")||"en",learn:store.get("wd-learn")||"zh",level:store.get("wd-level")||"0",
  sound:store.get("wd-sound")!=="0",voice:store.get("wd-voice")!=="0",hint:store.get("wd-hint")==="1"};
if(!T[P.ui])P.ui="vi";if(!LANGS[P.learn])P.learn="zh";if(!["0","1","all"].includes(P.level))P.level="0";
const fix=()=>{if(P.ui==="en"&&P.learn==="en")P.learn="zh"};fix();
const t=k=>T[P.ui][k];
const M=w=>P.ui==="en"?w[3]:w[2];
const L=()=>LANGS[P.learn];
const lvName=k=>k==="all"?t("both"):L().packs[+k][0];
const lvWords=k=>k==="all"?L().packs[0][1].concat(L().packs[1][1]):L().packs[+k][1];
let S={running:false,paused:false,lock:true},bag=[],pool=[];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const bestKey=k=>`wd-best-${P.learn}-${k}`;
const best=k=>+(store.get(bestKey(k))||0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function applyLang(){
  document.documentElement.lang=P.ui;document.title=t("title");
  document.querySelectorAll("[data-t]").forEach(el=>{el.textContent=t(el.dataset.t)});
  $("stamp").textContent=L().stamp;hzEl.lang=P.learn;
}
const CG={ok:false,adOn:false,
  async init(){try{const sdk=window.CrazyGames&&window.CrazyGames.SDK;if(!sdk)return;await sdk.init();this.ok=sdk.environment==="crazygames"||sdk.environment==="local"}catch(e){this.ok=false}},
  game(fn){if(!this.ok)return;try{window.CrazyGames.SDK.game[fn]()}catch(e){}},
  ad(type){return new Promise(res=>{if(!this.ok)return res(false);
    const done=ok=>{this.adOn=false;res(ok)};
    try{window.CrazyGames.SDK.ad.requestAd(type,{adStarted:()=>{this.adOn=true;try{speechSynthesis.cancel()}catch(e){}},adFinished:()=>done(true),adError:()=>done(false)})}catch(e){done(false)}})}};
let ac=null;
function beep(ok){if(!P.sound||CG.adOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=ok?"triangle":"sawtooth";o.frequency.setValueAtTime(ok?660:220,n);o.frequency.exponentialRampToValueAtTime(ok?990:130,n+(ok?.12:.25));g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(ok?.2:.1,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+.3);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+.32)}catch(e){}}
function speak(text){if(!P.voice||CG.adOn)return;try{if(!("speechSynthesis" in window))return;const code=L().speech,u=new SpeechSynthesisUtterance(text);u.lang=code;u.rate=.85;const pre=code.slice(0,2);const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith(pre));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

const mult=()=>Math.min(5,1+Math.floor(Math.max(0,(S.combo||0)-1)/5));
function hud(){
  $("score").textContent=S.score||0;$("combo").textContent="x"+mult();
  $("lives").innerHTML=Array.from({length:MAXL},(_,i)=>`<span class="lan${i<(S.lives??MAXL)?"":" off"}"></span>`).join("");
  $("pauseBtn").textContent=S.paused?t("resume"):t("pause");$("pauseBtn").disabled=!S.running;
}
function placeholders(){ans.innerHTML=[1,2,3,4].map(i=>`<button class="opt" type="button" disabled><kbd>${i}</kbd><span>—</span></button>`).join("")}
function renderAnswers(){ans.innerHTML=S.opts.map((o,i)=>`<button class="opt" type="button" data-i="${i}"><kbd>${i+1}</kbd><span>${esc(M(o))}</span></button>`).join("")}
function nextWord(){if(!bag.length)bag=shuffle(pool.slice());let w=bag.pop();if(S.cur&&w===S.cur&&bag.length){bag.unshift(w);w=bag.pop()}return w}
function options(w){return shuffle([w,...shuffle(pool.filter(x=>M(x)!==M(w))).slice(0,3)])}

function place(p){
  const sw=stage.clientWidth,tw=tile.offsetWidth,th=tile.offsetHeight;
  const x=Math.max(8,Math.min(S.x,sw-tw-8));
  const y=-th+p*(stage.clientHeight-GROUND-2);
  const r=reduce?0:Math.sin(S.phase+p*9)*5;
  tile.style.transform=`translate(${x}px,${y}px) rotate(${r}deg)`;
}
function newRound(){
  S.cur=nextWord();S.opts=options(S.cur);S.elapsed=0;
  hzEl.textContent=S.cur[0];pyEl.textContent=S.cur[1];
  hzEl.classList.toggle("long",[...S.cur[0]].length>L().long);
  tile.className="tile"+(P.hint?" show-py":"");tile.style.visibility="visible";
  const tw=tile.offsetWidth;S.x=12+Math.random()*Math.max(0,stage.clientWidth-tw-24);S.phase=Math.random()*6;
  place(0);renderAnswers();S.lock=false;
}
function start(){
  pool=lvWords(P.level);bag=[];
  S={running:true,paused:false,lock:true,score:0,combo:0,lives:MAXL,right:0,total:0,fall:7000,missed:[],cur:null,revived:false};CG.game("gameplayStart");
  logEl.innerHTML="";updateSum();ov.hidden=true;applyLang();hud();newRound();
}
function flash(text){
  const f=document.createElement("div");f.className="flash";f.textContent=text;
  const m=/translate\(([-\d.]+)px,([-\d.]+)px\)/.exec(tile.style.transform)||[0,0,0];
  f.style.left=(+m[1]+tile.offsetWidth/2-20)+"px";f.style.top=(+m[2]-10)+"px";
  stage.appendChild(f);setTimeout(()=>f.remove(),850);
}
function addLog(w,ok){
  S.total++;
  logEl.insertAdjacentHTML("afterbegin",`<li><span class="dot${ok?"":" no"}"></span><b lang="${P.learn}">${esc(w[0])}</b><i>${esc(w[1])}</i><span>${esc(M(w))}</span></li>`);
  while(logEl.children.length>40)logEl.lastElementChild.remove();
  updateSum();
}
function updateSum(){$("logSum").textContent=S.total?T[P.ui].sum(S.right,S.total):t("empty")}
function choose(i){
  if(!S.running||S.paused||S.lock||!S.opts[i])return;
  const btns=ans.children,ci=S.opts.indexOf(S.cur);
  if(i===ci){
    S.lock=true;S.combo++;S.right++;const pts=10*mult();S.score+=pts;
    btns[i].classList.add("good");tile.classList.add("hit","show-py");flash("+"+pts);
    beep(true);speak(S.cur[0]);addLog(S.cur,true);
    S.fall=Math.max(2400,7000-S.right*110);hud();setTimeout(newRound,650);
  }else fail(i);
}
function fail(i){
  S.lock=true;S.combo=0;S.lives--;
  const btns=ans.children,ci=S.opts.indexOf(S.cur);
  if(i>=0&&btns[i])btns[i].classList.add("bad");
  if(btns[ci])btns[ci].classList.add("good");
  tile.classList.add(i<0?"dropped":"miss","show-py");
  beep(false);speak(S.cur[0]);
  if(!S.missed.includes(S.cur))S.missed.push(S.cur);
  addLog(S.cur,false);hud();
  setTimeout(()=>{if(!S.running)return;S.lives<=0?gameOver():newRound()},1300);
}

function uiSeg(){return [["vi","Tiếng Việt"],["en","English"]].map(([k,l])=>`<button type="button" data-act="ui" data-v="${k}" aria-pressed="${k===P.ui}">${l}</button>`).join("")}
function learnSeg(){return Object.entries(LANGS).map(([k,v])=>{const off=P.ui==="en"&&k==="en";return `<button type="button" data-act="learn" data-v="${k}" aria-pressed="${k===P.learn}"${off?" disabled":""}><span lang="${k}">${v.native}</span><small>${off?t("needVi"):v.name[P.ui]}</small></button>`}).join("")}
function lvSeg(){return ["0","1","all"].map(k=>`<button type="button" data-act="lv" data-v="${k}" aria-pressed="${k===P.level}">${esc(lvName(k))}<small>${t("best")} ${best(k)}</small></button>`).join("")}
function toggles(){return ["sound","voice","hint"].map(k=>`<button type="button" data-act="tg" data-k="${k}" aria-pressed="${P[k]}">${t(k)}</button>`).join("")}
function showStart(){
  if(S.running)CG.game("gameplayStop");
  S.running=false;S.paused=false;S.lock=true;tile.style.visibility="hidden";placeholders();applyLang();hud();updateSum();
  ov.innerHTML=`<div class="card wide"><div class="cg"><div><h2>${t("title")}</h2><p>${t("intro")}</p><p class="keys">${t("keys")}</p>
  <button class="cta" type="button" data-act="start">${t("start")}</button></div><div>
  <div class="lbl">${t("learn")}</div><div class="seg two">${learnSeg()}</div>
  <div class="lbl">${t("level")}</div><div class="seg">${lvSeg()}</div>
  <div class="lbl">${t("ui")}</div><div class="seg two">${uiSeg()}</div>
  <div class="lbl">${t("options")}</div><div class="tg">${toggles()}</div></div></div></div>`;
  ov.hidden=false;
}
function setPause(v){
  if(!S.running)return;S.paused=v;hud();CG.game(v?"gameplayStop":"gameplayStart");
  if(v){ov.innerHTML=`<div class="card"><h2>${t("paused")}</h2><p>${T[P.ui].pausedTxt(S.score)}</p>
  <div class="lbl">${t("options")}</div><div class="tg">${toggles()}</div>
  <button class="cta" type="button" data-act="resume">${t("resume")}</button><button class="ghost" type="button" data-act="menu">${t("menu")}</button></div>`;ov.hidden=false}
  else ov.hidden=true;
}
function gameOver(){
  S.running=false;S.lock=true;hud();CG.game("gameplayStop");
  const old=best(P.level),rec=S.score>old;if(rec){store.set(bestKey(P.level),S.score);if(old>0)CG.game("happytime")}
  const miss=S.missed.map(w=>`<li><b lang="${P.learn}">${esc(w[0])}</b><i>${esc(w[1])}</i><span>${esc(M(w))}</span></li>`).join("");
  ov.innerHTML=`<div class="card"><h2>${t("over")}</h2>
  <div class="big">${S.score}${rec?`<span class="rec">${t("newRec")}</span>`:""}</div>
  <p>${T[P.ui].stats(S.right,S.total,L().name[P.ui]+" "+lvName(P.level),Math.max(old,S.score))}</p>
  ${miss?`<div class="lbl">${t("review")}</div><ul class="miss-list">${miss}</ul>`:""}
  ${CG.ok&&!S.revived?`<button class="cta" type="button" data-act="revive">${t("revive")}</button><button class="ghost" type="button" data-act="again">${t("again")}</button>`:`<button class="cta" type="button" data-act="again">${t("again")}</button>`}<button class="ghost" type="button" data-act="menu">${t("change")}</button></div>`;
  ov.hidden=false;
}

ov.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const a=b.dataset.act,v=b.dataset.v;
  if(a==="start")start();
  else if(a==="again"){b.disabled=true;CG.ad("midgame").then(start)}
  else if(a==="revive"){b.disabled=true;CG.ad("rewarded").then(ok=>{if(ok){S.revived=true;S.running=true;S.paused=false;S.lives=1;S.combo=0;ov.hidden=true;hud();CG.game("gameplayStart");newRound()}else{b.disabled=false;b.textContent="—";b.hidden=true}})}
  else if(a==="resume")setPause(false);
  else if(a==="menu")showStart();
  else if(a==="ui"){P.ui=v;fix();store.set("wd-ui",P.ui);store.set("wd-learn",P.learn);showStart()}
  else if(a==="learn"){P.learn=v;store.set("wd-learn",v);showStart()}
  else if(a==="lv"){P.level=v;store.set("wd-level",v);showStart()}
  else if(a==="tg"){const k=b.dataset.k;P[k]=!P[k];store.set("wd-"+k,P[k]?"1":"0");b.setAttribute("aria-pressed",P[k]);if(k==="hint"&&S.running&&P.hint)tile.classList.add("show-py")}
});
ans.addEventListener("click",e=>{const b=e.target.closest(".opt[data-i]");if(b)choose(+b.dataset.i)});
$("pauseBtn").addEventListener("click",()=>setPause(!S.paused));
document.addEventListener("keydown",e=>{
  if(e.key>="1"&&e.key<="4"){choose(+e.key-1);return}
  if((e.key===" "||e.key==="Escape"||e.key==="p"||e.key==="P")&&S.running){e.preventDefault();setPause(!S.paused);return}
  if(e.key==="Enter"&&!S.running&&!ov.hidden&&!e.target.closest("button")){e.preventDefault();start()}
});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&S.running&&!S.paused)setPause(true)});
let last=0;
function loop(n){
  const dt=last?Math.min(n-last,100):0;last=n;
  if(S.running&&!S.paused&&!S.lock){S.elapsed+=dt;const p=S.elapsed/S.fall;place(Math.min(p,1));if(p>=1)fail(-1)}
  requestAnimationFrame(loop);
}
const ro=new ResizeObserver(()=>{if(S.cur&&tile.style.visibility==="visible")place(Math.min(1,(S.elapsed||0)/(S.fall||7000)))});ro.observe(stage);
try{if("speechSynthesis" in window)speechSynthesis.getVoices()}catch(e){}
CG.game("loadingStart");showStart();requestAnimationFrame(loop);
CG.init().then(()=>{CG.game("loadingStop");if(!S.running&&!ov.hidden&&ov.querySelector('[data-act="start"]'))showStart()});
}
</script>
</body>
</html>
